global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "vistamations-app"
    static_configs:
      - targets: ["app:3000"]

  - job_name: "vistamations-nginx"
    static_configs:
      - targets: ["nginx:80"]

  - job_name: "vistamations-redis"
    static_configs:
      - targets: ["redis:6379"]
