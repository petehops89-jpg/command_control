<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Portal — Vistamations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0C0F;
    --card: #14171C;
    --card-hover: #1A1D23;
    --border: rgba(255,255,255,0.05);
    --amber: #E8A33D;
    --amber-dim: rgba(232,163,61,0.08);
    --amber-glow: 0 0 24px rgba(232,163,61,0.1);
    --cyan: #4FD1C5;
    --cyan-dim: rgba(79,209,197,0.08);
    --rust: #C44536;
    --rust-dim: rgba(196,69,54,0.08);
    --bone: #E8E6DF;
    --bone-dim: rgba(232,230,223,0.45);
    --muted: #6B7280;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--ink); color: var(--bone);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background-image:
      radial-gradient(ellipse at 30% 0%, rgba(232,163,61,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 100%, rgba(79,209,197,0.02) 0%, transparent 40%);
  }

  .portal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; width: 100%; max-width: 900px; height: 90vh; max-height: 700px;
    box-shadow: 0 0 60px rgba(0,0,0,0.5); display: flex; flex-direction: row; overflow: hidden;
  }

  .main-column {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    min-width: 0;
  }

  .sidebar {
    width: 280px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    transition: width 0.25s ease, opacity 0.2s ease;
    overflow: hidden;
  }
  .sidebar.collapsed { width: 0; opacity: 0; border-right: none; }

  .sidebar-header {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--amber);
    flex-shrink: 0; min-width: 0; white-space: nowrap;
  }

  .collapse-btn {
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--muted); cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; padding: 2px 8px; line-height: 1; transition: all 0.15s;
  }
  .collapse-btn:hover { color: var(--bone); border-color: rgba(232,163,61,0.3); }

  .sidebar-thread {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .sidebar-thread .snippet {
    padding: 8px 10px; border-radius: 6px;
    background: rgba(255,255,255,0.02); border: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
    font-size: 10px; line-height: 1.4; color: var(--bone-dim);
  }
  .snippet:hover { background: rgba(255,255,255,0.04); }
  .snippet .sn-author {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    font-weight: 600; letter-spacing: 0.8px; margin-bottom: 2px;
    color: var(--amber);
  }
  .snippet.pete .sn-author { color: var(--cyan); }
  .snippet .sn-time {
    font-family: 'JetBrains Mono', monospace; font-size: 7px;
    color: var(--muted); margin-top: 3px;
  }
  .snippet .sn-body { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sidebar-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted);
    text-align: center; padding: 10px;
  }

  .portal-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .portal-header .avatar-ring {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--amber), #c47d20);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: var(--ink);
    box-shadow: 0 0 12px rgba(232,163,61,0.15);
  }
  .portal-header .label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 2px; color: var(--amber); opacity: 0.8;
  }
  .portal-header .name {
    font-size: 14px; font-weight: 500; color: var(--bone); letter-spacing: 0.3px;
  }
  .portal-header .status-row { margin-left: auto; text-align: right; }
  .portal-header .protocol {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    letter-spacing: 1px; color: var(--muted); text-transform: uppercase;
  }
  .portal-header .protocol .live {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 5px var(--cyan); margin-right: 4px; vertical-align: middle;
  }

  /* ─── CHAT THREAD ─── */
  .chat-thread {
    flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .chat-thread .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    font-size: 12px; color: var(--muted); text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }
  .chat-thread .empty-state .arrow { font-size: 28px; opacity: 0.2; }

  .chat-bubble {
    max-width: 85%; padding: 12px 16px; border-radius: 10px;
    font-size: 12px; line-height: 1.55; position: relative;
  }
  .chat-bubble.from-olivia {
    align-self: flex-start;
    background: var(--card-hover); border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .chat-bubble.from-olivia .bubble-header {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    font-weight: 600; letter-spacing: 1px; color: var(--amber); margin-bottom: 4px;
  }
  .chat-bubble.from-olivia .bubble-time {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    color: var(--muted); margin-top: 6px;
  }

  .chat-bubble.from-pete {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(232,163,61,0.15), rgba(232,163,61,0.05));
    border: 1px solid rgba(232,163,61,0.15);
    border-bottom-right-radius: 3px;
    color: var(--bone);
  }
  .chat-bubble.from-pete .bubble-time {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    color: rgba(232,163,61,0.5); margin-top: 4px;
  }

  /* Agent thread inside Olivia's bubble */
  .agent-detail {
    margin-top: 8px; padding: 8px 10px;
    background: rgba(0,0,0,0.2); border-radius: 6px;
    border-left: 2px solid rgba(232,163,61,0.3);
  }
  .agent-detail .ad-name {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    font-weight: 600; color: var(--amber); margin-bottom: 2px;
  }
  .agent-detail .ad-msg {
    font-size: 10px; color: var(--bone); line-height: 1.4;
  }

  /* ─── INPUT AREA ─── */
  .input-area {
    padding: 12px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
    display: flex; gap: 8px; align-items: flex-end;
  }
  .input-area textarea {
    flex: 1; min-height: 44px; max-height: 100px; background: var(--ink);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--bone); font-family: 'JetBrains Mono', monospace;
    font-size: 11px; padding: 10px 12px; resize: none; outline: none;
    line-height: 1.5;
  }
  .input-area textarea:focus { border-color: rgba(232,163,61,0.3); }
  .input-area textarea::placeholder { color: rgba(255,255,255,0.08); }

  .btn-send {
    padding: 10px 18px; border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px;
    cursor: pointer; border: none; transition: all 0.2s;
    background: var(--amber); color: var(--ink); font-weight: 500;
    white-space: nowrap; flex-shrink: 0;
  }
  .btn-send:hover { background: #d4952e; }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ─── SIDEBAR TOGGLE ─── */
  .sidebar-toggle {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    background: var(--card); border: 1px solid var(--border);
    border-left: none; border-radius: 0 6px 6px 0;
    color: var(--amber); cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; padding: 8px 6px; line-height: 1;
    opacity: 0; transition: opacity 0.2s; z-index: 2;
    display: none;
  }
  .sidebar.collapsed ~ .main-column .sidebar-toggle { display: block; opacity: 1; }

  .portal-footer {
    padding: 8px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
    font-size: 9px; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; letter-spacing: 1px;
    display: flex; justify-content: space-between;
  }

  @media (max-width: 500px) {
    .portal { max-width: 100%; border-radius: 0; height: 100vh; max-height: none; }
  }
</style>
</head>
<body>

<div class="portal">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      Messages
      <div style="display:flex;gap:4px">
        <button class="collapse-btn" onclick="clearMessages()" title="Keep last 5, save rest" style="font-size:8px;padding:2px 6px">CLEAR</button>
        <button class="collapse-btn" onclick="toggleSidebar()" title="Collapse sidebar">X</button>
      </div>
    </div>
    <div class="sidebar-thread" id="sidebar-thread">
      <div class="sidebar-empty">No messages yet.</div>
    </div>
  </div>

  <div class="main-column">
    <div class="portal-header">
      <div class="avatar-ring">O</div>
      <div>
        <div class="label">Command Portal</div>
        <div class="name">Olivia — Executive Secretary</div>
      </div>
      <div class="status-row">
        <div class="protocol"><span class="live"></span> TWO-WAY</div>
        <div style="font-size:9px;color:var(--muted)" id="portal-time">--:-- AEST</div>
      </div>
    </div>

    <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" title="Show messages">&#x276F;</button>

    <!-- CHAT THREAD — Olivia's replies and Pete's messages appear here -->
    <div class="chat-thread" id="chat-thread">
      <div class="empty-state" id="empty-state">
        <span class="arrow">&#x2191;</span>
        <span>Type below to message Olivia.</span>
        <span>She'll coordinate with the team and report back.</span>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <textarea id="msg-input"
        placeholder="Olivia, ask Trinity for a health check..."
        rows="2"></textarea>
      <button class="btn-send" id="send-btn" onclick="sendMessage()">SEND</button>
    </div>

    <div class="portal-footer">
      <span>Command Portal v3</span>
      <span id="portal-runid">—</span>
    </div>
  </div>
</div>

<script>
const API_RESPOND = '/api/olivia/respond';
const API_NORESP = '/api/olivia/no-responses';
const API_QUEUE = '/api/olivia/queue';

const AGENTS = {
  'trinity':     { name:'Trinity',     role:'Apprentice Systems Engineer' },
  'gordon':      { name:'Gordon',      role:'Chief Hub Agent' },
  'merlin':      { name:'Merlin V.II', role:'Wizard Guide' },
  'olivia':      { name:'Olivia',      role:'Executive Secretary' },
  'claw':        { name:'Claw (Dee)',  role:'Legacy MCP Specialist' },
  'big brother': { name:'Big Brother', role:'Senior Software Architect' },
  'dee':         { name:'Dee',         role:'Cron & Research Worker' },
  'stefi':       { name:'Stefi',       role:'Graphics & Design Director' },
};

// Track which messages we've already rendered
let renderedIds = new Set();

function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('portal-time').textContent = hh + ':' + mm + ' AEST';
}

function timeStr(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-AU', { timeZone: 'Australia/Sydney', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

async function loadMessages() {
  try {
    // Fetch both responses (replies) and queue (Pete's original messages)
    const [rResp, rQueue] = await Promise.all([
      fetch('/api/olivia/responses').then(r => r.json()),
      fetch(API_QUEUE).then(r => r.json()),
    ]);

    // Build a message list: Pete's messages + Olivia's replies
    const messages = [];

    for (const resp of rResp) {
      // Pete's original message
      messages.push({
        id: resp.id + ':pete',
        responseId: resp.id,
        from: 'pete',
        message: resp.message,
        timestamp: resp.timestamp,
      });
      // Olivia's reply (and any agent replies inside)
      if (resp.agentReply) {
        // All agent replies for this response
        const allAgentReplies = rResp
          .filter(r => r.id === resp.id && r.agentReply)
          .map(r => ({
            id: r.id + ':' + r.agentReply.from,
            responseId: r.id,
            from: r.agentReply.from,
            message: r.agentReply.message,
            timestamp: r.agentReply.timestamp,
          }));

        // Show Olivia's summary first, then other agent details
        const oliviaRep = allAgentReplies.find(a => a.from === 'olivia');
        const otherReps = allAgentReplies.filter(a => a.from !== 'olivia');

        if (oliviaRep) {
          messages.push({ ...oliviaRep, subReplies: otherReps });
        } else {
          messages.push(...allAgentReplies);
        }
      }
    }

    // Sort by timestamp
    messages.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

    const thread = document.getElementById('chat-thread');
    const empty = document.getElementById('empty-state');
    let html = '';

    for (const msg of messages) {
      if (renderedIds.has(msg.id)) continue;
      renderedIds.add(msg.id);

      if (msg.from === 'pete') {
        html += '<div class="chat-bubble from-pete">' +
          msg.message +
          '<div class="bubble-time">Pete &middot; ' + timeStr(msg.timestamp) + '</div>' +
          '</div>';
      } else {
        const agent = AGENTS[msg.from] || { name: msg.from, role: '' };
        html += '<div class="chat-bubble from-olivia">' +
          '<div class="bubble-header">' + agent.name + ' &mdash; ' + agent.role + '</div>' +
          '<div>' + msg.message + '</div>';

        // Sub-replies from other agents
        if (msg.subReplies && msg.subReplies.length > 0) {
          for (const sub of msg.subReplies) {
            const sa = AGENTS[sub.from] || { name: sub.from, role: '' };
            html += '<div class="agent-detail">' +
              '<div class="ad-name">' + sa.name + ' &mdash; ' + sa.role + '</div>' +
              '<div class="ad-msg">' + sub.message + '</div>' +
              '</div>';
          }
        }

        html += '<div class="bubble-time">' + timeStr(msg.timestamp) + '</div>' +
          '</div>';
      }
    }

    if (html) {
      document.getElementById('empty-state').style.display = 'none';
      thread.insertAdjacentHTML('beforeend', html);
      thread.scrollTop = thread.scrollHeight;
    } else if (renderedIds.size === 0) {
      empty.style.display = 'flex';
    }

    // Build sidebar from all messages
    buildSidebar(messages);
  } catch (e) { /* server not ready */ }
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
}

async function buildSidebar(messages) {
  const container = document.getElementById('sidebar-thread');
  if (!messages || messages.length === 0) {
    container.innerHTML = '<div class="sidebar-empty">No messages yet.</div>';
    return;
  }
  let html = '';
  for (const msg of messages) {
    const cls = msg.from === 'pete' ? ' pete' : '';
    const agent = AGENTS[msg.from] || { name: msg.from };
    const body = msg.message.substring(0, 80) + (msg.message.length > 80 ? '…' : '');
    html += '<div class="snippet' + cls + '">' +
      '<div class="sn-author">' + agent.name + '</div>' +
      '<div class="sn-body">' + body + '</div>' +
      '<div class="sn-time">' + timeStr(msg.timestamp) + '</div>' +
      '</div>';
  }
  container.innerHTML = html;
}

async function clearMessages() {
  const ok = confirm('Clear message history? The last 5 will stay. Older messages save to pete/command-portal-messages/');
  if (!ok) return;
  try {
    const resp = await fetch('/api/olivia/clear-messages', { method: 'POST' });
    const data = await resp.json();
    renderedIds = new Set();
    document.getElementById('chat-thread').innerHTML = '<div class="empty-state" id="empty-state" style="display:none"><span class="arrow">&#x2191;</span><span>Type below to message Olivia.</span></div>';
    await loadMessages();
  } catch (e) { alert('Failed to clear: ' + e.message); }
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = '...';

  try {
    const resp = await fetch(API_RESPOND, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: 'Pete',
        message: text,
        timestamp: new Date().toISOString(),
      }),
    });
    if (resp.ok) {
      input.value = '';
      // Reload messages immediately to show Pete's sent message
      await loadMessages();
      // Then poll for Olivia's reply
      setTimeout(loadMessages, 3000);
      setTimeout(loadMessages, 6000);
    }
  } catch (e) { /* server unreachable */ }
  btn.disabled = false;
  btn.textContent = 'SEND';
}

// Auto-resize textarea
document.getElementById('msg-input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// Enter to send, Shift+Enter for newline
document.getElementById('msg-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

updateClock();
setInterval(updateClock, 30000);
loadMessages();
setInterval(loadMessages, 5000);
</script>
</body>
</html>
