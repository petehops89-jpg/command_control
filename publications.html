<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw Publications — Vistamations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0C0F;
    --card: #14171C;
    --card-hover: #1A1D23;
    --border: rgba(255,255,255,0.05);
    --amber: #E8A33D;
    --cyan: #4FD1C5;
    --rust: #C44536;
    --bone: #E8E6DF;
    --bone-dim: rgba(232,230,223,0.45);
    --muted: #6B7280;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--ink); color: var(--bone);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 30% 0%, rgba(232,163,61,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 100%, rgba(79,209,197,0.02) 0%, transparent 40%);
  }

  .container {
    max-width: 820px; margin: 0 auto; padding: 32px 24px 60px;
  }

  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .header-row h1 {
    font-family: 'JetBrains Mono', monospace; font-size: 16px;
    font-weight: 500; letter-spacing: 1px; color: var(--bone);
  }
  .header-row h1 .accent { color: var(--amber); }
  .header-row .back-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--amber); text-decoration: none; letter-spacing: 1px;
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
    transition: border-color 0.15s;
  }
  .header-row .back-btn:hover { border-color: rgba(232,163,61,0.3); }

  .count-bar {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px;
    margin-bottom: 16px;
  }

  .pub-list { display: flex; flex-direction: column; gap: 8px; }

  .pub-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px;
    text-decoration: none; color: inherit; transition: all 0.15s;
  }
  .pub-card:hover {
    background: var(--card-hover);
    border-color: rgba(232,163,61,0.12);
  }

  .pub-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: linear-gradient(135deg, rgba(232,163,61,0.15), rgba(232,163,61,0.04));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; border: 1px solid rgba(232,163,61,0.1);
  }

  .pub-meta { flex: 1; min-width: 0; }
  .pub-meta .pub-id {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    font-weight: 500; color: var(--amber); letter-spacing: 0.5px;
    word-break: break-all;
  }
  .pub-meta .pub-date {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    color: var(--muted); margin-top: 3px;
  }
  .pub-meta .pub-size {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    color: var(--bone-dim); margin-top: 1px;
  }

  .pub-arrow {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--muted); flex-shrink: 0;
  }

  .empty-state {
    text-align: center; padding: 60px 20px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--muted);
  }

  .error-state {
    text-align: center; padding: 60px 20px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--rust);
  }

  @media (max-width: 500px) {
    .container { padding: 20px 16px 40px; }
    .pub-card { padding: 10px 12px; gap: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header-row">
    <h1>OpenClaw <span class="accent">Publications</span></h1>
    <a href="index.html" class="back-btn">&larr; Dashboard</a>
  </div>

  <div class="count-bar" id="count-bar">Loading&hellip;</div>

  <div class="pub-list" id="pub-list">
    <div class="empty-state">Loading publications&hellip;</div>
  </div>
</div>

<script>
const API = '/api/publications';

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('en-AU', {
    timeZone: 'Australia/Sydney',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

async function load() {
  try {
    const resp = await fetch(API);
    const data = await resp.json();
    const list = document.getElementById('pub-list');
    const count = document.getElementById('count-bar');

    count.textContent = data.length + ' publication' + (data.length !== 1 ? 's' : '') + ' &mdash; auto-synced from cron output';

    if (data.length === 0) {
      list.innerHTML = '<div class="empty-state">No publications yet. Reports appear here automatically when cron jobs run.</div>';
      return;
    }

    let html = '';
    for (const pub of data) {
      html += '<a href="' + pub.path + '" class="pub-card" target="_blank">' +
        '<div class="pub-icon">&#x1F4C4;</div>' +
        '<div class="pub-meta">' +
          '<div class="pub-id">' + pub.displayName + '</div>' +
          '<div class="pub-date">' + formatDate(pub.runDate) + ' AEST</div>' +
          '<div class="pub-size">' + formatSize(pub.size) + '</div>' +
        '</div>' +
        '<span class="pub-arrow">&rarr;</span>' +
      '</a>';
    }
    list.innerHTML = html;
  } catch (e) {
    document.getElementById('pub-list').innerHTML = '<div class="error-state">Could not load publications. Server may be offline.</div>';
    document.getElementById('count-bar').textContent = 'Error';
  }
}

load();
</script>
</body>
</html>
