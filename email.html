<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Hub — Vistamations Command Control</title>
<style>
  :root { --bg: #06060d; --card-bg: rgba(15,15,28,0.85); --text: #d4d4e8; --text-dim: rgba(212,212,232,0.5); --border: rgba(255,255,255,0.06); --radius: 12px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'SF Mono','JetBrains Mono',monospace; background: var(--bg); color: var(--text); min-height:100vh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse at 50% 0%, rgba(124,77,255,0.08), transparent 60%); pointer-events:none; }

  .menu-strip { display:flex; align-items:center; gap:0; background:var(--card-bg); border-bottom:1px solid var(--border); backdrop-filter:blur(12px); position:sticky; top:0; z-index:10; padding:0 16px; }
  .menu-strip .brand { font-size:12px; font-weight:500; color:#fff; letter-spacing:2px; padding:14px 0; margin-right:24px; border-right:1px solid var(--border); padding-right:24px; }
  .menu-strip .brand em { font-style:normal; color:#7c4dff; }
  .menu-strip a { color: var(--text-dim); text-decoration:none; font-size:10px; padding:14px 16px; border-bottom:2px solid transparent; transition:all 0.2s; text-transform:uppercase; letter-spacing:1px; }
  .menu-strip a:hover, .menu-strip a.active { color:#fff; border-bottom-color:#7c4dff; }

  .tab-bar { display:flex; gap:0; border-bottom:1px solid var(--border); background:rgba(15,15,28,0.5); padding:0 20px; }
  .tab { padding:12px 28px; font-size:11px; cursor:pointer; color:var(--text-dim); border-bottom:2px solid transparent; text-transform:uppercase; letter-spacing:1px; transition:all 0.2s; background:none; border-top:none; border-left:none; border-right:none; font-family:inherit; }
  .tab:hover { color:#fff; background:rgba(255,255,255,0.02); }
  .tab.active { color:#fff; border-bottom-color:var(--tab-color, #7c4dff); }
  .tab.unconfigured { opacity:0.4; }

  .container { max-width:960px; margin:0 auto; padding:20px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .header h1 { font-size:18px; font-weight:500; color:#fff; letter-spacing:0.5px; }
  .header .meta { font-size:10px; color:var(--text-dim); }
  .refresh-btn { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text); padding:6px 14px; border-radius:6px; cursor:pointer; font-size:10px; font-family:inherit; transition:all 0.2s; }
  .refresh-btn:hover { border-color:rgba(255,255,255,0.15); }

  .inbox { display:flex; flex-direction:column; gap:2px; }
  .email-row { display:flex; flex-direction:column; padding:12px 16px; background:rgba(255,255,255,0.02); border-left:3px solid transparent; cursor:pointer; transition:all 0.15s; border-radius:0 6px 6px 0; margin-bottom:1px; }
  .email-row:hover { background:rgba(255,255,255,0.04); }
  .email-row .top-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; }
  .email-row .from { font-size:11px; font-weight:500; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
  .email-row .date { font-size:9px; color:var(--text-dim); white-space:nowrap; }
  .email-row .subject { font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .email-row .snippet { font-size:10px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--text-dim); }
  .empty-state .icon { font-size:40px; margin-bottom:12px; opacity:0.3; }
  .empty-state h3 { font-size:14px; color:var(--text); margin-bottom:6px; }
  .empty-state p { font-size:11px; max-width:400px; margin:0 auto; line-height:1.6; }

  .error-state { text-align:center; padding:40px 20px; color:#C44536; }
  .loading { text-align:center; padding:40px; color:var(--text-dim); font-size:11px; }

  .setup-box { background:rgba(124,77,255,0.05); border:1px solid rgba(124,77,255,0.15); border-radius:var(--radius); padding:16px 20px; margin-bottom:16px; }
  .setup-box h4 { font-size:11px; color:#7c4dff; margin-bottom:4px; text-transform:uppercase; letter-spacing:1px; }
  .setup-box p { font-size:10px; color:var(--text-dim); line-height:1.5; }
  .setup-box code { background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:4px; font-size:9px; }
</style>
</head>
<body>

<div class="menu-strip">
  <div class="brand">Vistamations <em>Email Hub</em></div>
  <a href="index.html">Command Control</a>
  <a href="crons/openclaw/olivia/command-portal.html">Command Portal</a>
  <a href="media-player.html">Media Centre</a>
  <a href="email.html" class="active">Email</a>
</div>

<div class="tab-bar">
  <button class="tab active" data-account="hops" style="--tab-color:#4285F4">Hops</button>
  <button class="tab" data-account="pete" style="--tab-color:#E8A33D">Pete</button>
  <button class="tab" data-account="james" style="--tab-color:#C44536">James</button>
</div>

<div class="container">
  <div class="header">
    <div>
      <h1 id="accountTitle">hops1010@gmail.com</h1>
      <div class="meta" id="accountMeta"></div>
    </div>
    <button class="refresh-btn" onclick="loadInbox()">↻ Refresh</button>
  </div>
  <div id="setupBox" class="setup-box"></div>
  <div id="inboxContainer">
    <div class="loading">Loading inbox...</div>
  </div>
</div>

<script>
var currentAccount = 'hops';

var tabs = document.querySelectorAll('.tab');
tabs.forEach(function(tab) {
  tab.addEventListener('click', function() {
    tabs.forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    currentAccount = tab.dataset.account;
    loadInbox();
  });
});

function loadInbox() {
  var inboxEl = document.getElementById('inboxContainer');
  var setupEl = document.getElementById('setupBox');
  inboxEl.innerHTML = '<div class="loading">Loading inbox...</div>';
  setupEl.innerHTML = '';

  fetch('/api/email/accounts')
    .then(function(r) { return r.json(); })
    .then(function(accounts) {
      var acct = accounts.find(function(a) { return a.key === currentAccount; });
      if (!acct) { showError('Account not found'); return; }
      document.getElementById('accountTitle').textContent = acct.label + ' — ' + acct.user;
      document.getElementById('accountMeta').textContent = acct.configured ? 'Configured' : 'Needs app password';

      if (!acct.configured) {
        setupEl.innerHTML = '<h4>⚙️ App Password Required</h4><p>To connect <strong>' + acct.user + '</strong>, generate a Gmail App Password and set it in <code>.env</code> as <code>EMAIL_PASSWORD_' + acct.key.toUpperCase() + '=your-password</code>, then rebuild with <code>docker compose up -d --build app</code>.</p><p>1. Go to Google Account → Security → 2-Step Verification → App Passwords<br>2. Select "Mail" and your device<br>3. Copy the 16-character password<br>4. Add to .env and rebuild</p>';
        inboxEl.innerHTML = '<div class="empty-state"><div class="icon">🔐</div><h3>App Password Required</h3><p>Set EMAIL_PASSWORD_' + acct.key.toUpperCase() + ' in .env and rebuild the Docker container.</p></div>';
        tabs.forEach(function(tab) {
          if (tab.dataset.account === currentAccount) tab.classList.add('unconfigured');
        });
        return;
      }

      tabs.forEach(function(tab) {
        if (tab.dataset.account === currentAccount) tab.classList.remove('unconfigured');
      });

      return fetch('/api/email/inbox/' + currentAccount + '?limit=30');
    })
    .then(function(r) {
      if (!r) return;
      if (r.status) return r.json();
      return r;
    })
    .then(function(data) {
      if (!data || !data.messages) { showError('No response'); return; }
      if (data.messages.length === 0) {
        inboxEl.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>Inbox Empty</h3><p>No messages found in ' + data.account + '.</p></div>';
        return;
      }

      var html = '<div class="inbox">';
      data.messages.forEach(function(msg) {
        var dateStr = msg.date ? new Date(msg.date).toLocaleDateString('en-AU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
        html += '<div class="email-row">';
        html += '<div class="top-row"><span class="from">' + escapeHtml(msg.from) + '</span><span class="date">' + dateStr + '</span></div>';
        html += '<div class="subject">' + escapeHtml(msg.subject) + '</div>';
        html += '<div class="snippet">' + escapeHtml(msg.snippet || '') + '</div>';
        html += '</div>';
      });
      html += '</div>';
      inboxEl.innerHTML = html;
    })
    .catch(function(e) {
      showError(e.message || 'Connection failed');
    });
}

function showError(msg) {
  document.getElementById('inboxContainer').innerHTML = '<div class="error-state">⚠ ' + msg + '</div>';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadInbox();
</script>
</body>
</html>
