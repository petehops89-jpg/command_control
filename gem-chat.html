<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gem — Vistamations Music AI</title>
<style>
  :root {
    --ink:#0A0C0F; --card:#111418; --border:#1E2229;
    --amber:#E8A33D; --cyan:#4FD1C5; --rust:#C44536;
    --text:#C8CCD0; --dim:#6B7280;
    --mono:'JetBrains Mono','Consolas',monospace;
    --body:'Inter','Segoe UI',system-ui,sans-serif;
    --r:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--ink);color:var(--text);font-family:var(--body);
    height:100vh;display:flex;flex-direction:column;
  }
  .header{
    padding:1rem 1.5rem;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:0.75rem;
  }
  .header .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .header .name{font-family:var(--mono);font-weight:600;color:#fff;font-size:1rem}
  .header .status{font-size:0.7rem;color:var(--cyan);font-family:var(--mono)}
  .header .right{margin-left:auto;font-family:var(--mono);font-size:0.65rem;color:var(--dim)}
  .chat{
    flex:1;overflow-y:auto;padding:1.5rem;
    display:flex;flex-direction:column;gap:1rem;
  }
  .msg{max-width:80%;padding:0.75rem 1rem;border-radius:var(--r);font-size:0.85rem;line-height:1.5}
  .msg.pete{align-self:flex-end;background:var(--amber);color:var(--ink);border-bottom-right-radius:2px}
  .msg.gem{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:2px}
  .msg .sender{font-family:var(--mono);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.35rem;opacity:0.6}
  .msg.pete .sender{color:var(--ink)}
  .msg.gem .sender{color:var(--cyan)}
  .input-bar{
    padding:1rem 1.5rem;border-top:1px solid var(--border);
    display:flex;gap:0.75rem;
  }
  .input-bar input{
    flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);
    font-family:var(--body);font-size:0.85rem;padding:0.75rem 1rem;border-radius:var(--r);
    outline:none;transition:border-color .2s;
  }
  .input-bar input:focus{border-color:var(--amber)}
  .input-bar button{
    background:var(--amber);color:var(--ink);border:none;font-family:var(--mono);
    font-size:0.75rem;font-weight:600;padding:0.75rem 1.25rem;border-radius:var(--r);
    cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;
  }
  .input-bar button:hover{background:#F0B451}
  .typing{font-size:0.7rem;color:var(--dim);font-style:italic;padding:0 0.5rem}
</style>
</head>
<body>

<div class="header">
  <div class="dot"></div>
  <div>
    <div class="name">gem</div>
    <div class="status">online — music AI</div>
  </div>
  <div class="right" id="clock"></div>
</div>

<div class="chat" id="chat">
  <div class="msg gem">
    <div class="sender">gem</div>
    Online and listening. I can see your music library — 23 Tim Cochrane tracks. Neo-classical shred guitar is my specialty. Ask me anything.
  </div>
</div>

<div class="input-bar">
  <input type="text" id="input" placeholder="Ask gem about music, Suno, neo-classical shred..." autofocus>
  <button onclick="send()">Send</button>
</div>

<script>
const api = '/api/olivia/respond';
const pending = '/api/olivia/pending-replies';
let lastCheck = Date.now();

// Clock
function tick(){
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}) +
    ' AEST';
}
tick(); setInterval(tick,1000);

// Send message
async function send(){
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if(!msg) return;

  addMessage('Pete', msg, 'pete');
  input.value = '';

  // Show typing
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.id = 'typing';
  typing.textContent = 'gem is typing...';
  document.getElementById('chat').appendChild(typing);

  // Send to Olivia
  try {
    await fetch(api, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({from:'Pete',message:msg,timestamp:new Date().toISOString()})
    });
  } catch(e){ console.error(e) }

  // Poll for gem's reply
  pollForReply(10);
}

async function pollForReply(attempts){
  if(attempts <= 0){
    const t = document.getElementById('typing');
    if(t) t.remove();
    return;
  }

  try {
    const res = await fetch(pending);
    const replies = await res.json();
    for(const r of replies){
      if(!r.agentReply) continue;
      if(r.agentReply.from !== 'gem') continue;
      if(r._seen) continue;
      r._seen = true;
      const t = document.getElementById('typing');
      if(t) t.remove();
      addMessage('gem', r.agentReply.message, 'gem');
      return;
    }
  } catch(e){}

  setTimeout(() => pollForReply(attempts-1), 2000);
}

function addMessage(sender, text, cls){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = '<div class="sender">'+sender+'</div>'+text;
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

// Enter to send
document.getElementById('input').addEventListener('keydown', e => {
  if(e.key === 'Enter') send();
});
</script>
</body>
</html>
