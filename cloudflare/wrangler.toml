# Vistamations — Cloudflare Workers + D1 + KV Configuration
# Agent memory (D1), session cache (KV), document pipeline (KV), static assets (KV)
# Name: vistamations-agent-memory

name = "vistamations-agent-memory"
main = "src/worker.js"
compatibility_date = "2026-08-09"

# ─── D1 Database — persistent agent memory, session state, play tracking
[[d1_databases]]
binding = "AGENT_DB"
database_name = "vistamations-agent-memory"
database_id = ""  # filled after `wrangler d1 create`

# ─── KV Namespaces — eventually-consistent, globally replicated key-value
[[kv_namespaces]]
binding = "HANDY_MAIL_KV"
id = ""  # filled after `wrangler kv:namespace create`
preview_id = ""

[[kv_namespaces]]
binding = "SESSION_KV"
id = ""
preview_id = ""

[[kv_namespaces]]
binding = "MYA_KV"
id = ""
preview_id = ""

# ─── Cron triggers for periodic agent tasks
[triggers]
crons = [
  { schedule = "*/5 * * * *", binding = "handyMailSessionGC" },
]

# Environment variables (non-secret)
[vars]
PROJECT_NAME = "Vistamations"
PROJECT_DOMAIN = "vistamations-music"

# Secrets (set via wrangler secret put)
# GOOGLE_API_KEY — Gemini access
# GOOGLE_GENAI_USE_ENTERPRISE — Enterprise mode flag
# OLIVIA_API_URL — Command portal endpoint for agent reporting
