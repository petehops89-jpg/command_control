<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAccounts — Vistamations Secure Vault</title>
<style>
  :root { --bg: #06060d; --card-bg: rgba(15,15,28,0.9); --text: #d4d4e8; --text-dim: rgba(212,212,232,0.5); --border: rgba(255,255,255,0.06); --accent: #7c4dff; --gold: #FFD700; --rust: #C44536; --cyan: #4FD1C5; --radius: 14px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'SF Mono','JetBrains Mono',monospace; background: var(--bg); color: var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:0; }
  body::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse at 50% 10%, rgba(124,77,255,0.12), transparent 60%); pointer-events:none; }
  .menu-strip { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:0; background:rgba(15,15,28,0.9); border-bottom:1px solid var(--border); backdrop-filter:blur(12px); z-index:10; padding:0 16px; }
  .menu-strip .brand { font-size:12px; font-weight:500; color:#fff; letter-spacing:2px; padding:14px 0; margin-right:24px; border-right:1px solid var(--border); padding-right:24px; }
  .menu-strip .brand em { font-style:normal; color:var(--accent); }
  .menu-strip a { color:var(--text-dim); text-decoration:none; font-size:10px; padding:14px 16px; border-bottom:2px solid transparent; transition:all 0.2s; text-transform:uppercase; letter-spacing:1px; }
  .menu-strip a:hover { color:#fff; border-bottom-color:var(--accent); }
  .container { width:100%; max-width:560px; margin-top:80px; margin-bottom:80px; padding:0 20px; z-index:1; }

  .vault-visual { text-align:center; margin-bottom:24px; }
  .vault-visual .vault-icon { font-size:64px; margin-bottom:8px; animation: vaultPulse 3s ease-in-out infinite; }
  @keyframes vaultPulse { 0%,100% { transform:scale(1); opacity:0.85; } 50% { transform:scale(1.03); opacity:1; } }
  .vault-visual h1 { font-size:22px; font-weight:400; color:#fff; letter-spacing:1px; }
  .vault-visual .sub { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:2px; margin-top:4px; }

  /* ─── LOCK SCREEN ─── */
  .panel { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:30px 24px; backdrop-filter:blur(12px); margin-bottom:16px; }
  .panel h3 { font-size:14px; text-transform:uppercase; letter-spacing:2px; margin-bottom:20px; text-align:center; }
  .panel h3.locked { color:var(--gold); }
  .panel h3.unlocked { color:var(--accent); }
  .pin-dots { display:flex; justify-content:center; gap:12px; margin-bottom:24px; }
  .pin-dot { width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); transition:all 0.2s; }
  .pin-dot.filled { background:var(--gold); border-color:var(--gold); box-shadow:0 0 8px rgba(255,215,0,0.3); }
  .pin-dot.error { background:var(--rust); border-color:var(--rust); animation:shake 0.4s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .keypad { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; max-width:240px; margin:0 auto 12px; }
  .key { padding:16px; font-size:20px; font-weight:500; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:var(--text); cursor:pointer; font-family:inherit; transition:all 0.15s; }
  .key:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.15); }
  .key:active { background:var(--accent); border-color:var(--accent); color:#fff; transform:scale(0.95); }
  .key.clear { font-size:12px; color:var(--text-dim); }
  .key.submit { font-size:12px; color:var(--gold); }
  .msg { font-size:10px; text-align:center; min-height:16px; margin-top:8px; }
  .msg.err { color:var(--rust); }
  .msg.ok { color:var(--cyan); }

  /* ─── PASSWORD DASHBOARD ─── */
  .dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .dash-header h3 { margin-bottom:0; }
  .dash-header .lock-btn { background:rgba(196,69,54,0.1); border:1px solid rgba(196,69,54,0.2); color:var(--rust); padding:6px 14px; border-radius:6px; cursor:pointer; font-size:10px; font-family:inherit; transition:all 0.2s; }
  .dash-header .lock-btn:hover { background:rgba(196,69,54,0.2); }

  .tabs { display:flex; gap:2px; margin-bottom:16px; border-bottom:1px solid var(--border); }
  .tab { flex:1; padding:10px; font-size:10px; text-transform:uppercase; letter-spacing:1px; cursor:pointer; background:none; border:none; border-bottom:2px solid transparent; color:var(--text-dim); font-family:inherit; transition:all 0.2s; }
  .tab.active { color:#fff; border-bottom-color:var(--accent); }
  .tab:hover { color:var(--text); }

  .pwd-list { display:flex; flex-direction:column; gap:6px; }
  .pwd-item { display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(255,255,255,0.02); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; cursor:pointer; transition:all 0.15s; }
  .pwd-item:hover { background:rgba(255,255,255,0.05); }
  .pwd-item .pwd-icon { font-size:20px; flex-shrink:0; }
  .pwd-item .pwd-info { flex:1; min-width:0; }
  .pwd-item .pwd-name { font-size:12px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pwd-item .pwd-target { font-size:9px; color:var(--text-dim); }
  .pwd-item .pwd-date { font-size:8px; color:var(--text-dim); }
  .pwd-item .pwd-copy { flex-shrink:0; padding:4px 10px; font-size:9px; background:rgba(124,77,255,0.1); border:1px solid rgba(124,77,255,0.2); color:var(--accent); border-radius:4px; cursor:pointer; display:none; }
  .pwd-item.revealed .pwd-copy { display:inline-block; }
  .pwd-item .pwd-value { font-size:9px; color:var(--gold); margin-top:2px; display:none; word-break:break-all; }
  .pwd-item.revealed .pwd-value { display:block; }
  .pwd-item.revealed { background:rgba(124,77,255,0.06); border-left-color:var(--gold); }

  .empty-state { text-align:center; padding:40px 20px; color:var(--text-dim); }
  .empty-state .icon { font-size:36px; margin-bottom:8px; opacity:0.3; }

  /* ─── ADD NEW FORM ─── */
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-bottom:6px; }
  .form-group input, .form-group textarea { width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:12px; outline:none; }
  .form-group input:focus, .form-group textarea:focus { border-color:var(--accent); }
  .form-group select { width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:12px; outline:none; }
  .form-group select option { background:#1a1a2e; color:var(--text); }
  .form-group .hint { font-size:8px; color:var(--text-dim); margin-top:4px; }
  .form-row { display:flex; gap:8px; }
  .form-row .form-group { flex:1; }
  .pw-strength { height:4px; border-radius:2px; margin-top:4px; background:rgba(255,255,255,0.05); overflow:hidden; }
  .pw-strength div { height:100%; width:0; transition:all 0.3s; }
  .btn { padding:10px 20px; border:none; border-radius:8px; font-size:11px; font-weight:500; cursor:pointer; font-family:inherit; transition:all 0.2s; }
  .btn-primary { background:linear-gradient(135deg,var(--accent),#4a2fb5); color:#fff; flex:1; }
  .btn-primary:hover { opacity:0.9; }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--text-dim); }

  .auto-lock-timer { font-size:9px; color:var(--text-dim); text-align:center; margin-top:12px; }

  /* ─── ENROLL SCREEN ─── */
  .enroll-screen { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:30px 24px; text-align:center; backdrop-filter:blur(12px); }
  .enroll-screen h3 { font-size:14px; color:var(--gold); margin-bottom:8px; text-transform:uppercase; letter-spacing:2px; }
  .enroll-screen p { font-size:10px; color:var(--text-dim); margin-bottom:20px; }
  .enroll-screen input { width:60%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:10px; color:var(--text); font-family:inherit; font-size:20px; letter-spacing:8px; text-align:center; margin-bottom:12px; outline:none; }
  .enroll-screen input:focus { border-color:var(--gold); }
</style>
</head>
<body>

<div class="menu-strip">
  <div class="brand">Vistamations <em>GAccounts</em></div>
  <a href="index.html">Command Control</a>
  <a href="email.html">Email</a>
  <a href="gaccounts.html" style="color:#fff;border-bottom-color:var(--accent)">GAccounts</a>
</div>

<div class="container">

  <div class="vault-visual">
    <div class="vault-icon">🏦</div>
    <h1>Secure Vault</h1>
    <div class="sub">Master PIN • Local Vault • Conflict-Free</div>
  </div>

  <!-- ENROLL: first-time PIN setup -->
  <div class="enroll-screen" id="enrollScreen" style="display:none">
    <h3>Set Your Master PIN</h3>
    <p>4-digit PIN. This is the ONLY key to your vault. Agents cannot access this.</p>
    <input type="password" id="enrollPin" maxlength="4" placeholder="••••" autocomplete="off">
    <input type="password" id="enrollPinConfirm" maxlength="4" placeholder="•••• confirm" autocomplete="off">
    <button class="btn btn-primary" onclick="enrollPin()" style="display:block;margin:0 auto;width:auto">🔐 Set Master PIN</button>
    <div class="msg" id="enrollMsg"></div>
  </div>

  <!-- LOCK SCREEN -->
  <div class="panel" id="lockScreen">
    <h3 class="locked">🔒 Vault Locked</h3>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="keypad">
      <button class="key" onclick="pinPress('1')">1</button>
      <button class="key" onclick="pinPress('2')">2</button>
      <button class="key" onclick="pinPress('3')">3</button>
      <button class="key" onclick="pinPress('4')">4</button>
      <button class="key" onclick="pinPress('5')">5</button>
      <button class="key" onclick="pinPress('6')">6</button>
      <button class="key" onclick="pinPress('7')">7</button>
      <button class="key" onclick="pinPress('8')">8</button>
      <button class="key" onclick="pinPress('9')">9</button>
      <button class="key clear" onclick="pinPress('clear')">CLR</button>
      <button class="key" onclick="pinPress('0')">0</button>
      <button class="key submit" onclick="pinPress('submit')">→</button>
    </div>
    <div class="msg" id="lockMsg"></div>
  </div>

  <!-- UNLOCKED: Password Dashboard -->
  <div class="panel" id="dashScreen" style="display:none">
    <div class="dash-header">
      <h3 class="unlocked">🔓 Vault Unlocked</h3>
      <button class="lock-btn" onclick="lockVault()">🔒 Lock</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="list" id="tabList">Passwords</button>
      <button class="tab" data-tab="add" id="tabAdd">+ Add New</button>
    </div>

    <!-- Password List -->
    <div id="tabContent">
      <div class="pwd-list" id="pwdList">
        <div class="empty-state"><div class="icon">🔐</div><p>No passwords stored yet.</p></div>
      </div>
    </div>

    <div class="msg" id="dashMsg"></div>
    <div class="auto-lock-timer" id="autoLockTimer" style="display:none">Auto-lock in 3:00</div>
  </div>

</div>

<script>
var pinBuffer = '';
var vaultToken = '';
var autoLockTimer = null;
var autoLockSeconds = 180;

function init() {
  fetch('/api/accounts/vault-status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.enrolled) {
        document.getElementById('lockScreen').style.display = 'block';
        document.getElementById('enrollScreen').style.display = 'none';
      } else {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('enrollScreen').style.display = 'block';
      }
    })
    .catch(function() {
      document.getElementById('lockScreen').style.display = 'block';
      document.getElementById('lockMsg').textContent = 'Service offline';
      document.getElementById('lockMsg').className = 'msg err';
    });
}

document.getElementById('tabList').addEventListener('click', function() { switchTab('list'); });
document.getElementById('tabAdd').addEventListener('click', function() { switchTab('add'); });

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');

  if (tab === 'list') loadPasswordList();
  else showAddForm();
}

function pinPress(val) {
  var msgEl = document.getElementById('lockMsg');
  msgEl.textContent = '';
  msgEl.className = 'msg';
  if (val === 'clear') { pinBuffer = ''; updateDots(); return; }
  if (val === 'submit') {
    if (pinBuffer.length !== 4) { msgEl.textContent = 'Enter 4 digits'; msgEl.className = 'msg err'; shakeDots(); return; }
    document.getElementById('lockScreen').style.opacity = '0.6';
    document.getElementById('lockScreen').style.pointerEvents = 'none';
    fetch('/api/accounts/vault-unlock', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pinBuffer })
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.ok) { vaultToken = data.token; unlockVault(); }
      else { document.getElementById('lockScreen').style.opacity = '1'; document.getElementById('lockScreen').style.pointerEvents = 'auto'; msgEl.textContent = data.reason || 'Wrong PIN'; msgEl.className = 'msg err'; shakeDots(); }
      pinBuffer = ''; updateDots();
    }).catch(function() { document.getElementById('lockScreen').style.opacity = '1'; document.getElementById('lockScreen').style.pointerEvents = 'auto'; msgEl.textContent = 'Offline'; msgEl.className = 'msg err'; pinBuffer = ''; updateDots(); });
    return;
  }
  if (pinBuffer.length < 4) { pinBuffer += val; updateDots(); }
}

function updateDots() {
  document.querySelectorAll('#pinDots .pin-dot').forEach(function(d, i) { d.classList.remove('filled','error'); if (i < pinBuffer.length) d.classList.add('filled'); });
}
function shakeDots() {
  document.querySelectorAll('#pinDots .pin-dot').forEach(function(d) { d.classList.add('error'); });
  setTimeout(function() { document.querySelectorAll('#pinDots .pin-dot').forEach(function(d) { d.classList.remove('error'); }); }, 500);
}

function unlockVault() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('dashScreen').style.display = 'block';
  startAutoLockTimer();
  loadPasswordList();
}

function lockVault() {
  vaultToken = '';
  pinBuffer = '';
  updateDots();
  document.getElementById('lockScreen').style.display = 'block';
  document.getElementById('lockScreen').style.opacity = '1';
  document.getElementById('lockScreen').style.pointerEvents = 'auto';
  document.getElementById('lockMsg').textContent = '';
  document.getElementById('lockMsg').className = 'msg';
  document.getElementById('dashScreen').style.display = 'none';
  stopAutoLockTimer();
}

function startAutoLockTimer() {
  autoLockSeconds = 180;
  document.getElementById('autoLockTimer').style.display = 'block';
  autoLockTimer = setInterval(function() {
    autoLockSeconds--;
    var m = Math.floor(autoLockSeconds / 60), s = autoLockSeconds % 60;
    document.getElementById('autoLockTimer').textContent = 'Auto-lock in ' + m + ':' + (s < 10 ? '0' : '') + s;
    if (autoLockSeconds <= 0) lockVault();
  }, 1000);
}
function stopAutoLockTimer() { if (autoLockTimer) clearInterval(autoLockTimer); autoLockTimer = null; document.getElementById('autoLockTimer').style.display = 'none'; }

// ─── PASSWORD LIST ───
function loadPasswordList() {
  if (!vaultToken) return;
  document.getElementById('pwdList').innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Loading...</p></div>';
  fetch('/api/accounts/vault-list', { headers: { 'X-Vault-Token': vaultToken } })
    .then(function(r) { return r.json(); }).then(function(data) {
      if (!data.items || !data.items.length) {
        document.getElementById('pwdList').innerHTML = '<div class="empty-state"><div class="icon">🔐</div><p>No passwords stored.</p><p style="font-size:10px;margin-top:4px">Use + Add New to add your first credential.</p></div>';
        return;
      }
      var html = '<div class="pwd-list">';
      data.items.forEach(function(item, i) {
        html += '<div class="pwd-item" id="item' + i + '" onclick="toggleReveal(' + i + ', \'' + escapeHtml(item.key) + '\')">';
        html += '<div class="pwd-icon">' + getIcon(item.target) + '</div>';
        html += '<div class="pwd-info"><div class="pwd-name">' + escapeHtml(item.key) + '</div>';
        html += '<div class="pwd-target">' + escapeHtml(item.target) + '</div>';
        html += '<div class="pwd-date">' + (item.storedAt ? new Date(item.storedAt).toLocaleDateString('en-AU',{day:'numeric',month:'short'}) : '') + '</div>';
        html += '<div class="pwd-value" id="val' + i + '">••••••••••••</div></div>';
        html += '<button class="pwd-copy" id="copy' + i + '" onclick="event.stopPropagation();copyPassword(' + i + ')">📋 Copy</button>';
        html += '</div>';
      });
      html += '</div>';
      document.getElementById('pwdList').innerHTML = html;
    });
}

function toggleReveal(idx, key) {
  var item = document.getElementById('item' + idx);
  var valEl = document.getElementById('val' + idx);
  if (item.classList.contains('revealed')) { item.classList.remove('revealed'); return; }
  fetch('/api/accounts/vault-reveal', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vault-Token': vaultToken },
    body: JSON.stringify({ key: key })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.value) { valEl.textContent = data.value; item.classList.add('revealed'); }
  });
}

function copyPassword(idx) {
  var valEl = document.getElementById('val' + idx);
  var text = valEl.textContent;
  if (text === '••••••••••••') return;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('copy' + idx); btn.textContent = '✅ Copied!';
    setTimeout(function() { btn.textContent = '📋 Copy'; }, 2000);
  });
}

function getIcon(target) {
  var m = { 'cloudflare':'☁️','gmail':'📧','google':'🔷','github':'🐙','facebook':'📘','twitter':'🐦','aws':'☁️','azure':'💠' };
  var lower = (target || '').toLowerCase();
  for (var k in m) { if (lower.includes(k)) return m[k]; }
  return '🔑';
}

// ─── ADD NEW FORM ───
function showAddForm() {
  var html = '<div class="form-group"><label>Service</label><select id="newTarget">';
  html += '<option value="Gmail">Gmail</option><option value="Cloudflare">Cloudflare</option><option value="Google Cloud">Google Cloud</option>';
  html += '<option value="GitHub">GitHub</option><option value="Facebook">Facebook</option>';
  html += '<option value="AWS">AWS</option><option value="Azure">Azure</option><option value="Custom">Custom / Other</option></select></div>';
  html += '<div class="form-group"><label>Identifier / Username</label><input type="text" id="newKey" placeholder="e.g. hops1010@gmail.com" autocomplete="off"></div>';
  html += '<div class="form-group"><label>Master Password <span style="font-size:8px;color:var(--text-dim)">(12+ chars, uppercase, lowercase, number)</span></label>';
  html += '<input type="password" id="newValue" placeholder="Enter strong password" autocomplete="off" oninput="checkStrength()">';
  html += '<div class="pw-strength"><div id="pwBar"></div></div><div class="hint" id="pwHint"></div></div>';
  html += '<div class="form-group"><label>Confirm Password</label><input type="password" id="newValueConfirm" placeholder="Re-enter password" autocomplete="off"></div>';
  html += '<div class="form-group"><label>Notes (optional)</label><input type="text" id="newNotes" placeholder="What is this for?" autocomplete="off"></div>';
  html += '<div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="switchTab(\'list\')">Cancel</button>';
  html += '<button class="btn btn-primary" onclick="submitNew()">💾 Store in Vault</button></div>';
  html += '<div class="msg" id="addMsg"></div>';
  document.getElementById('tabContent').innerHTML = html;
}

function checkStrength() {
  var v = document.getElementById('newValue').value;
  var bar = document.getElementById('pwBar'), hint = document.getElementById('pwHint');
  var score = 0;
  if (v.length >= 12) score++;
  if (v.length >= 16) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[a-z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  var colors = ['#C44536','#C44536','#E8A33D','#E8A33D','#4FD1C5','#4FD1C5','#7c4dff'];
  bar.style.width = (score / 6 * 100) + '%'; bar.style.background = colors[score];
  hint.textContent = score < 3 ? 'Weak — needs 12+ chars, mixed case, numbers' : score < 5 ? 'Decent — add more variety' : 'Strong password';
}

function submitNew() {
  var t = document.getElementById('newTarget').value;
  var k = document.getElementById('newKey').value.trim();
  var v = document.getElementById('newValue').value;
  var c = document.getElementById('newValueConfirm').value;
  var n = document.getElementById('newNotes').value.trim();
  var msg = document.getElementById('addMsg');
  if (!k) { msg.textContent = 'Identifier is required'; msg.className = 'msg err'; return; }
  if (!v) { msg.textContent = 'Password is required'; msg.className = 'msg err'; return; }
  if (v.length < 8) { msg.textContent = 'Password must be at least 8 characters'; msg.className = 'msg err'; return; }
  if (!/[A-Z]/.test(v)) { msg.textContent = 'Password needs at least one uppercase letter'; msg.className = 'msg err'; return; }
  if (!/[a-z]/.test(v)) { msg.textContent = 'Password needs at least one lowercase letter'; msg.className = 'msg err'; return; }
  if (!/[0-9]/.test(v)) { msg.textContent = 'Password needs at least one number'; msg.className = 'msg err'; return; }
  if (v !== c) { msg.textContent = 'Passwords do not match'; msg.className = 'msg err'; return; }
  msg.textContent = 'Storing...'; msg.className = 'msg';

  fetch('/api/accounts/vault-store', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vault-Token': vaultToken },
    body: JSON.stringify({ token: vaultToken, target: t, key: k, value: v, notes: n })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.ok) {
      msg.textContent = '✅ Stored. Locking vault...'; msg.className = 'msg ok';
      setTimeout(function() { lockVault(); }, 1000);
    } else { msg.textContent = '❌ ' + (data.error || 'Failed'); msg.className = 'msg err'; }
  }).catch(function() { msg.textContent = '❌ Offline'; msg.className = 'msg err'; });
}

function enrollPin() {
  var p = document.getElementById('enrollPin').value.trim();
  var c = document.getElementById('enrollPinConfirm').value.trim();
  if (!/^\d{4}$/.test(p)) { document.getElementById('enrollMsg').textContent = 'Exactly 4 digits'; document.getElementById('enrollMsg').className = 'msg err'; return; }
  if (p !== c) { document.getElementById('enrollMsg').textContent = 'PINs do not match'; document.getElementById('enrollMsg').className = 'msg err'; return; }
  fetch('/api/accounts/vault-enroll', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pin:p}) })
    .then(function(r) { return r.json(); }).then(function(data) {
      if (data.ok) { document.getElementById('enrollScreen').style.display='none'; document.getElementById('lockScreen').style.display='block'; document.getElementById('lockMsg').textContent='Master PIN set. Enter PIN to unlock.'; document.getElementById('lockMsg').className='msg ok'; }
      else { document.getElementById('enrollMsg').textContent = data.error; document.getElementById('enrollMsg').className = 'msg err'; }
    });
}

function escapeHtml(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

init();
</script>
