<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vistamations Clock — Wagga Wagga</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #111118;
    --border: #1e1e2e;
    --text: #e0e0f0;
    --accent: #00e5ff;
    --accent2: #7c4dff;
    --warn: #ff9100;
    --danger: #ff1744;
    --success: #00e676;
    --glow: 0 0 20px rgba(0, 229, 255, 0.15);
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(0, 229, 255, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(124, 77, 255, 0.04) 0%, transparent 60%);
  }

  .container {
    width: 100%;
    max-width: 900px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ─── HEADER ─── */
  .header {
    text-align: center;
    padding: 8px 0;
  }
  .header .brand {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent2);
    opacity: 0.7;
  }

  /* ─── CLOCK PANEL ─── */
  .clock-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    box-shadow: var(--glow);
    position: relative;
    overflow: hidden;
  }
  .clock-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  .location {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--accent);
    margin-bottom: 8px;
    opacity: 0.8;
  }

  .time-display {
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 300;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
    line-height: 1;
    user-select: none;
  }
  .time-display .seconds {
    font-size: 0.35em;
    color: var(--accent);
    opacity: 0.6;
    vertical-align: super;
    letter-spacing: 0;
  }
  .time-display .ampm {
    font-size: 0.3em;
    color: var(--accent2);
    opacity: 0.7;
    margin-left: 4px;
    letter-spacing: 0;
  }

  .date-display {
    font-size: 15px;
    color: var(--text);
    opacity: 0.6;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* ─── WEATHER PANEL ─── */
  .weather-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .weather-icon {
    font-size: 48px;
    line-height: 1;
    filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.3));
  }
  .weather-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .weather-temp {
    font-size: 40px;
    font-weight: 300;
    color: #fff;
    line-height: 1;
  }
  .weather-desc {
    font-size: 13px;
    color: var(--accent);
    opacity: 0.7;
    text-transform: capitalize;
  }
  .weather-details {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .weather-detail {
    text-align: center;
    min-width: 60px;
  }
  .weather-detail .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text);
    opacity: 0.4;
  }
  .weather-detail .value {
    font-size: 16px;
    color: var(--accent);
    margin-top: 2px;
  }

  /* ─── TOOLBAR ─── */
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
    color: #fff;
  }
  .btn:active {
    transform: scale(0.97);
  }
  .btn.active {
    border-color: var(--accent);
    background: rgba(0, 229, 255, 0.08);
    color: var(--accent);
  }
  .btn.accent {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .btn.accent:hover {
    box-shadow: 0 0 12px rgba(124, 77, 255, 0.2);
    background: rgba(124, 77, 255, 0.08);
  }
  .btn .ico { font-size: 16px; }

  /* ─── WORLD CLOCK PANEL ─── */
  .world-clock-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    display: none;
    overflow: hidden;
  }
  .world-clock-panel.visible { display: block; }

  .world-clock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 2px;
  }
  .world-city {
    background: var(--bg);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .world-city:hover {
    border-color: var(--border);
    background: #14141e;
  }
  .world-city .city-name {
    font-size: 12px;
    color: var(--text);
    opacity: 0.5;
  }
  .world-city .city-time {
    font-size: 20px;
    color: #fff;
    font-weight: 300;
    letter-spacing: 1px;
  }
  .world-city .city-date {
    font-size: 10px;
    color: var(--accent);
    opacity: 0.5;
  }
  .world-city .city-offset {
    font-size: 10px;
    color: var(--accent2);
    opacity: 0.5;
  }

  /* ─── STATUS BAR ─── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text);
    opacity: 0.3;
    padding: 0 8px;
    letter-spacing: 0.5px;
  }
  .status-bar span { display: flex; align-items: center; gap: 6px; }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    display: inline-block;
    box-shadow: 0 0 6px var(--success);
  }
  .status-dot.error { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .status-dot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .container { padding: 12px; gap: 10px; }
    .clock-panel { padding: 24px 16px; }
    .weather-panel { padding: 16px; gap: 12px; }
    .weather-icon { font-size: 36px; }
    .weather-temp { font-size: 32px; }
    .weather-details { gap: 12px; }
    .btn { padding: 8px 14px; font-size: 12px; }
    .world-clock-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.7; }
  }
  .colon-pulse { animation: pulse 2s ease-in-out infinite; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="brand">Vistamations</div>
  </div>

  <!-- CLOCK -->
  <div class="clock-panel" id="clockPanel">
    <div class="location" id="clockLocation">Wagga Wagga, NSW</div>
    <div class="time-display" id="timeDisplay"></div>
    <div class="date-display" id="dateDisplay"></div>
  </div>

  <!-- WEATHER -->
  <div class="weather-panel" id="weatherPanel">
    <div class="weather-icon" id="weatherIcon">--</div>
    <div class="weather-main">
      <div class="weather-temp" id="weatherTemp">--°</div>
      <div class="weather-desc" id="weatherDesc">Loading...</div>
    </div>
    <div class="weather-details">
      <div class="weather-detail">
        <div class="label">Feels Like</div>
        <div class="value" id="weatherFeels">--°</div>
      </div>
      <div class="weather-detail">
        <div class="label">Humidity</div>
        <div class="value" id="weatherHum">--%</div>
      </div>
      <div class="weather-detail">
        <div class="label">Wind</div>
        <div class="value" id="weatherWind">--</div>
      </div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <button class="btn" id="btnWorldClock" title="World Clock">
      <span class="ico">&#x1F310;</span> World Clock
    </button>
    <button class="btn" id="btn24hr" title="Toggle 24-Hour Format">
      <span class="ico">&#x1F552;</span> 24h: Off
    </button>
    <button class="btn accent" id="btnAudioPlayer" title="Launch Audio Player">
      <span class="ico">&#x1F3B5;</span> Audio Player
    </button>
    <button class="btn accent" id="btnMediaPlayer" title="Launch Media Player">
      <span class="ico">&#x1F3AC;</span> Media Player
    </button>
  </div>

  <!-- WORLD CLOCK -->
  <div class="world-clock-panel" id="worldClockPanel">
    <div class="world-clock-grid" id="worldClockGrid"></div>
  </div>

  <!-- STATUS -->
  <div class="status-bar">
    <span><span class="status-dot" id="statusDot"></span><span id="statusText">Online</span></span>
    <span id="updateTime">--</span>
  </div>

</div>

<script>
(function () {
  const WAGGA = { lat: -35.1082, lon: 147.3598, tz: 'Australia/Sydney', name: 'Wagga Wagga, NSW' };

  const WORLD_CITIES = [
    { name: 'New York', tz: 'America/New_York' },
    { name: 'London', tz: 'Europe/London' },
    { name: 'Tokyo', tz: 'Asia/Tokyo' },
    { name: 'Dubai', tz: 'Asia/Dubai' },
    { name: 'Los Angeles', tz: 'America/Los_Angeles' },
    { name: 'Paris', tz: 'Europe/Paris' },
    { name: 'Beijing', tz: 'Asia/Shanghai' },
    { name: 'Moscow', tz: 'Europe/Moscow' },
  ];

  let use24h = false;
  let showWorldClock = false;
  let weatherData = null;
  let weatherError = null;

  // ─── DOM refs ───
  const $time = document.getElementById('timeDisplay');
  const $date = document.getElementById('dateDisplay');
  const $loc = document.getElementById('clockLocation');
  const $btn24 = document.getElementById('btn24hr');
  const $btnWorld = document.getElementById('btnWorldClock');
  const $btnAudio = document.getElementById('btnAudioPlayer');
  const $btnMedia = document.getElementById('btnMediaPlayer');
  const $wcPanel = document.getElementById('worldClockPanel');
  const $wcGrid = document.getElementById('worldClockGrid');
  const $statusDot = document.getElementById('statusDot');
  const $statusText = document.getElementById('statusText');
  const $updateTime = document.getElementById('updateTime');
  const $wIcon = document.getElementById('weatherIcon');
  const $wTemp = document.getElementById('weatherTemp');
  const $wDesc = document.getElementById('weatherDesc');
  const $wFeels = document.getElementById('weatherFeels');
  const $wHum = document.getElementById('weatherHum');
  const $wWind = document.getElementById('weatherWind');

  // ─── WEATHER CODES (WMO) ───
  const WMO_CODES = {
    0:  { icon: '\u2600\uFE0F', desc: 'Clear sky' },
    1:  { icon: '\uD83C\uDF24\uFE0F', desc: 'Mainly clear' },
    2:  { icon: '\u26C5', desc: 'Partly cloudy' },
    3:  { icon: '\u2601\uFE0F', desc: 'Overcast' },
    45: { icon: '\uD83C\uDF2B\uFE0F', desc: 'Fog' },
    48: { icon: '\uD83C\uDF2B\uFE0F', desc: 'Rime fog' },
    51: { icon: '\uD83C\uDF26\uFE0F', desc: 'Light drizzle' },
    53: { icon: '\uD83C\uDF26\uFE0F', desc: 'Moderate drizzle' },
    55: { icon: '\uD83C\uDF26\uFE0F', desc: 'Dense drizzle' },
    61: { icon: '\uD83C\uDF27\uFE0F', desc: 'Slight rain' },
    63: { icon: '\uD83C\uDF27\uFE0F', desc: 'Moderate rain' },
    65: { icon: '\uD83C\uDF27\uFE0F', desc: 'Heavy rain' },
    71: { icon: '\u2744\uFE0F', desc: 'Slight snow' },
    73: { icon: '\u2744\uFE0F', desc: 'Moderate snow' },
    75: { icon: '\u2744\uFE0F', desc: 'Heavy snow' },
    80: { icon: '\uD83C\uDF28\uFE0F', desc: 'Rain showers' },
    81: { icon: '\uD83C\uDF28\uFE0F', desc: 'Moderate showers' },
    82: { icon: '\uD83C\uDF28\uFE0F', desc: 'Violent showers' },
    95: { icon: '\u26C8\uFE0F', desc: 'Thunderstorm' },
    96: { icon: '\u26C8\uFE0F', desc: 'Thunderstorm + hail' },
    99: { icon: '\u26C8\uFE0F', desc: 'Thunderstorm + heavy hail' },
  };

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatTime(date, is24h) {
    let h = date.getHours();
    let m = pad(date.getMinutes());
    let s = pad(date.getSeconds());
    if (is24h) {
      return { main: pad(h) + ':' + m, seconds: s, ampm: '' };
    } else {
      let ampm = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12 || 12;
      return { main: h12 + ':' + m, seconds: s, ampm: ampm };
    }
  }

  function formatDate(date) {
    return date.toLocaleDateString('en-AU', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  function updateClock() {
    const now = new Date();
    const t = formatTime(now, use24h);
    let html = t.main;
    html += '<span class="seconds colon-pulse">:' + t.seconds + '</span>';
    if (t.ampm) html += '<span class="ampm">' + t.ampm + '</span>';
    $time.innerHTML = html;
    $date.textContent = formatDate(now);
  }

  function renderWorldClock() {
    $wcGrid.innerHTML = WORLD_CITIES.map(c => {
      const now = new Date();
      const tzDate = new Date(now.toLocaleString('en-US', { timeZone: c.tz }));
      const t = formatTime(tzDate, use24h);
      const offsetMin = (tzDate.getTime() - now.getTime()) / 60000;
      const offsetH = Math.floor(Math.abs(offsetMin) / 60);
      const sign = offsetMin >= 0 ? '+' : '-';
      const offsetStr = 'GMT' + sign + offsetH;
      const isNextDay = tzDate.getDate() !== now.getDate();
      const dateLabel = isNextDay ? (offsetMin > 0 ? 'Tomorrow' : 'Yesterday') : 'Today';
      return '<div class="world-city">' +
        '<div class="city-name">' + c.name + '</div>' +
        '<div class="city-time">' + t.main + (t.ampm ? '<span style="font-size:0.45em;opacity:0.5;margin-left:3px">' + t.ampm + '</span>' : '') + '</div>' +
        '<div class="city-date">' + dateLabel + '</div>' +
        '<div class="city-offset">' + offsetStr + '</div>' +
        '</div>';
    }).join('');
  }

  // ─── WEATHER ───
  async function fetchWeather() {
    try {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + WAGGA.lat +
        '&longitude=' + WAGGA.lon +
        '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,is_day' +
        '&timezone=Australia%2FSydney';
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      weatherData = data.current;
      weatherError = null;
      updateWeatherDisplay();
      setStatus('ok', 'Weather online');
    } catch (e) {
      weatherError = e.message;
      setStatus('warn', 'Weather: ' + e.message);
      $wIcon.textContent = '\u26A0\uFE0F';
      $wTemp.textContent = '--°';
      $wDesc.textContent = 'Offline';
      $wFeels.textContent = '--°';
      $wHum.textContent = '--%';
      $wWind.textContent = '--';
    }
  }

  function windDir(deg) {
    const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    return dirs[Math.round(deg / 22.5) % 16];
  }

  function updateWeatherDisplay() {
    if (!weatherData) return;
    const w = weatherData;
    const code = WMO_CODES[w.weather_code] || { icon: '\u2753', desc: 'Unknown' };
    $wIcon.textContent = code.icon;
    $wTemp.textContent = Math.round(w.temperature_2m) + '°C';
    $wDesc.textContent = code.desc;
    $wFeels.textContent = Math.round(w.apparent_temperature) + '°C';
    $wHum.textContent = w.relative_humidity_2m + '%';
    $wWind.textContent = Math.round(w.wind_speed_10m) + ' km/h ' + windDir(w.wind_direction_10m || 0);
  }

  function setStatus(type, text) {
    $statusDot.className = 'status-dot';
    if (type === 'warn') $statusDot.classList.add('warn');
    if (type === 'error') $statusDot.classList.add('error');
    $statusText.textContent = text;
    $updateTime.textContent = new Date().toLocaleTimeString();
  }

  // ─── BUTTON HANDLERS ───
  $btn24.addEventListener('click', () => {
    use24h = !use24h;
    $btn24.innerHTML = '<span class="ico">\uD83D\uDD52</span> 24h: ' + (use24h ? 'On' : 'Off');
    $btn24.classList.toggle('active', use24h);
    updateClock();
    if (showWorldClock) renderWorldClock();
  });

  $btnWorld.addEventListener('click', () => {
    showWorldClock = !showWorldClock;
    $wcPanel.classList.toggle('visible', showWorldClock);
    $btnWorld.classList.toggle('active', showWorldClock);
    if (showWorldClock) renderWorldClock();
  });

  $btnAudio.addEventListener('click', () => {
    window.location.href = '/media-player/index.html#audio';
  });

  $btnMedia.addEventListener('click', () => {
    window.location.href = '/media-player/index.html#media';
  });

  // ─── INIT ───
  updateClock();
  fetchWeather();
  setInterval(updateClock, 1000);
  setInterval(() => {
    if (showWorldClock) renderWorldClock();
    $updateTime.textContent = new Date().toLocaleTimeString();
  }, 10000);
  setInterval(fetchWeather, 900000); // refresh weather every 15 min
})();
</script>
</body>
</html>
