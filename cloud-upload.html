<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Upload — Vistamations GCS Storage</title>
<style>
  :root { --bg: #06060d; --card-bg: rgba(15,15,28,0.85); --text: #d4d4e8; --text-dim: rgba(212,212,232,0.5); --border: rgba(255,255,255,0.06); --accent: #00e5ff; --gold: #FFD700; --rust: #C44536; --cyan: #4FD1C5; --radius: 14px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'SF Mono','JetBrains Mono',monospace; background: var(--bg); color: var(--text); min-height:100vh; }
  body::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse at 50% 0%, rgba(0,229,255,0.05), transparent 60%); pointer-events:none; }
  .menu-strip { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:0; background:rgba(15,15,28,0.9); border-bottom:1px solid var(--border); backdrop-filter:blur(12px); z-index:100; padding:0 16px; }
  .menu-strip .brand { font-size:12px; font-weight:500; color:#fff; letter-spacing:2px; padding:14px 0; margin-right:24px; border-right:1px solid var(--border); padding-right:24px; }
  .menu-strip .brand em { font-style:normal; color:var(--accent); }
  .menu-strip a { color:var(--text-dim); text-decoration:none; font-size:10px; padding:14px 16px; border-bottom:2px solid transparent; transition:all 0.2s; text-transform:uppercase; letter-spacing:1px; }
  .menu-strip a:hover, .menu-strip a.active { color:#fff; border-bottom-color:var(--accent); }
  .container { max-width:900px; margin:0 auto; padding:80px 20px 40px; }

  .hero { text-align:center; margin-bottom:28px; }
  .hero h1 { font-size:24px; font-weight:300; color:#fff; letter-spacing:1px; }
  .hero .sub { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:2px; margin-top:4px; }

  /* ─── PANEL ─── */
  .panel { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:24px; backdrop-filter:blur(12px); margin-bottom:16px; }

  .upload-zone { border:2px dashed rgba(0,229,255,0.2); border-radius:var(--radius); padding:48px 20px; text-align:center; cursor:pointer; transition:all 0.3s; margin-bottom:16px; }
  .upload-zone:hover { border-color:var(--accent); background:rgba(0,229,255,0.03); }
  .upload-zone.dragover { border-color:var(--accent); background:rgba(0,229,255,0.06); }
  .upload-zone .uz-icon { font-size:36px; margin-bottom:8px; opacity:0.5; }
  .upload-zone .uz-text { font-size:11px; color:var(--text-dim); }
  .upload-zone .uz-browse { font-size:10px; color:var(--accent); margin-top:6px; cursor:pointer; text-decoration:underline; }

  .file-list { display:flex; flex-direction:column; gap:4px; max-height:280px; overflow-y:auto; }
  .file-row { display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(255,255,255,0.02); border-left:3px solid transparent; border-radius:0 8px 8px 0; transition:all 0.15s; }
  .file-row:hover { background:rgba(255,255,255,0.04); }
  .file-row .f-icon { font-size:16px; flex-shrink:0; }
  .file-row .f-info { flex:1; min-width:0; }
  .file-row .f-name { font-size:11px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-row .f-size { font-size:9px; color:var(--text-dim); }
  .file-row .f-status { font-size:9px; flex-shrink:0; }
  .file-row .f-status.pending { color:var(--text-dim); }
  .file-row .f-status.uploading { color:var(--accent); }
  .file-row .f-status.done { color:var(--cyan); }
  .file-row .f-status.failed { color:var(--rust); }
  .file-row.selected { border-left-color:var(--accent); background:rgba(0,229,255,0.04); }

  .controls { display:flex; align-items:center; gap:16px; margin-top:16px; flex-wrap:wrap; }
  .btn { padding:10px 24px; border:none; border-radius:8px; font-size:11px; font-weight:500; cursor:pointer; font-family:inherit; transition:all 0.2s; }
  .btn-upload { background:linear-gradient(135deg,var(--accent),#009faf); color:#000; }
  .btn-upload:hover { opacity:0.85; }
  .btn-upload:disabled { opacity:0.3; cursor:default; }
  .btn-clear { background:transparent; border:1px solid var(--border); color:var(--text-dim); }
  .toggle-row { display:flex; align-items:center; gap:8px; font-size:10px; color:var(--text-dim); }
  .toggle-row input[type=checkbox] { accent-color:var(--accent); }
  .progress-bar { height:4px; background:rgba(255,255,255,0.05); border-radius:2px; margin-top:8px; overflow:hidden; }
  .progress-bar div { height:100%; width:0%; background:var(--accent); transition:width 0.3s; }
  .summary { font-size:10px; color:var(--text-dim); margin-top:12px; text-align:center; }

  .bucket-config { margin-bottom:16px; }
  .bucket-config label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-bottom:6px; }
  .bucket-config input { width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:12px; outline:none; }
  .bucket-config input:focus { border-color:var(--accent); }

  .empty-state { text-align:center; padding:24px; color:var(--text-dim); font-size:10px; }

  .uploaded-list { margin-top:16px; }
  .uploaded-list .u-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:10px; }
  .uploaded-list .u-name { color:var(--text); }
  .uploaded-list .u-size { color:var(--text-dim); }
  .uploaded-list .u-status { color:var(--cyan); }
</style>
</head>
<body>

<div class="menu-strip">
  <div class="brand">Vistamations <em>Cloud Storage</em></div>
  <a href="index.html">Command Control</a>
  <a href="cloud-upload.html" class="active">Cloud Upload</a>
  <a href="gaccounts.html">GAccounts</a>
</div>

<div class="container">
  <div class="hero">
    <h1>Cloud Storage Upload</h1>
    <div class="sub">Google Cloud Storage &bull; vists-498322</div>
  </div>

  <div class="panel bucket-config">
    <label>Bucket Name</label>
    <input type="text" id="bucketName" value="vistamations-storage" placeholder="vistamations-storage" autocomplete="off">
  </div>

  <div class="panel" id="dropZone">
    <div class="upload-zone" id="uploadZone">
      <div class="uz-icon">&#x2601;</div>
      <div class="uz-text">Drop files here or <span class="uz-browse" id="browseLink">browse</span></div>
      <input type="file" id="fileInput" multiple style="display:none" accept="*/*">
    </div>

    <div class="file-list" id="fileList">
      <div class="empty-state">No files selected. Drop files or click browse.</div>
    </div>

    <div class="controls">
      <button class="btn btn-upload" id="uploadBtn" onclick="startUpload()" disabled>Upload to Cloud</button>
      <button class="btn btn-clear" onclick="clearFiles()">Clear</button>
      <label class="toggle-row">
        <input type="checkbox" id="deleteAfter" checked>
        Delete from disk after upload
      </label>
    </div>

    <div class="progress-bar"><div id="progressFill"></div></div>
    <div class="summary" id="summary"></div>

    <div class="uploaded-list" id="uploadedList"></div>
  </div>
</div>

<script>
var selectedFiles = [];

var dropZone = document.getElementById('dropZone');
var uploadZone = document.getElementById('uploadZone');
var fileInput = document.getElementById('fileInput');
var browseLink = document.getElementById('browseLink');

browseLink.addEventListener('click', function(e) { e.stopPropagation(); fileInput.click(); });
uploadZone.addEventListener('click', function() { fileInput.click(); });

uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', function() { uploadZone.classList.remove('dragover'); });
uploadZone.addEventListener('drop', function(e) { e.preventDefault(); uploadZone.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', function() { addFiles(fileInput.files); fileInput.value = ''; });

function addFiles(files) {
  for (var i = 0; i < files.length; i++) {
    selectedFiles.push({ file: files[i], status: 'pending', id: Date.now() + '_' + i });
  }
  renderFiles();
}

function renderFiles() {
  var list = document.getElementById('fileList');
  var btn = document.getElementById('uploadBtn');
  if (selectedFiles.length === 0) {
    list.innerHTML = '<div class="empty-state">No files selected. Drop files or click browse.</div>';
    btn.disabled = true;
    return;
  }
  btn.disabled = false;
  var html = '';
  selectedFiles.forEach(function(f) {
    var icon = f.file.type.startsWith('image/') ? '🖼' : f.file.type.startsWith('video/') ? '🎬' : f.file.type.startsWith('audio/') ? '🎵' : '📄';
    var size = (f.file.size / 1024 / 1024).toFixed(1);
    html += '<div class="file-row" data-id="' + f.id + '"><div class="f-icon">' + icon + '</div>';
    html += '<div class="f-info"><div class="f-name">' + escapeHtml(f.file.name) + '</div><div class="f-size">' + size + ' MB</div></div>';
    html += '<div class="f-status ' + f.status + '">' + getStatusLabel(f.status) + '</div></div>';
  });
  list.innerHTML = html;
}

function getStatusLabel(s) {
  return s === 'pending' ? 'Ready' : s === 'uploading' ? 'Uploading...' : s === 'done' ? '✅ Uploaded' : s === 'failed' ? '❌ Failed' : s;
}

function clearFiles() { selectedFiles = []; renderFiles(); }

async function startUpload() {
  var bucket = document.getElementById('bucketName').value.trim() || 'vistamations-storage';
  var deleteAfter = document.getElementById('deleteAfter').checked;
  var summary = document.getElementById('summary');
  var progress = document.getElementById('progressFill');
  var uploadedList = document.getElementById('uploadedList');

  var uploaded = []; var failed = [];
  summary.textContent = 'Uploading ' + selectedFiles.length + ' file(s)...';

  for (var i = 0; i < selectedFiles.length; i++) {
    var f = selectedFiles[i];
    f.status = 'uploading'; renderFiles();

    var formData = new FormData();
    formData.append('file', f.file);
    formData.append('bucket', bucket);
    formData.append('deleteAfter', deleteAfter ? 'true' : 'false');

    try {
      var res = await fetch('/api/cloud/upload', { method: 'POST', body: formData });
      var data = await res.json();
      if (data.ok) {
        f.status = 'done'; uploaded.push(f.file.name);
        renderFiles();
        var item = document.createElement('div'); item.className = 'u-item';
        item.innerHTML = '<span class="u-name">' + escapeHtml(f.file.name) + '</span><span class="u-size">' + (f.file.size/1024/1024).toFixed(1) + ' MB</span><span class="u-status">✅ ' + (data.deleted ? 'Uploaded & deleted' : 'Uploaded') + '</span>';
        uploadedList.appendChild(item);
      } else {
        f.status = 'failed'; failed.push(f.file.name); renderFiles();
      }
    } catch (e) {
      f.status = 'failed'; failed.push(f.file.name); renderFiles();
    }
    progress.style.width = ((i + 1) / selectedFiles.length * 100) + '%';
  }

  var msg = '✅ ' + uploaded.length + ' uploaded';
  if (deleteAfter) msg += ' & deleted locally';
  if (failed.length) msg += ', ❌ ' + failed.length + ' failed';
  summary.textContent = msg;
}

function escapeHtml(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
</script>
</body>
</html>
